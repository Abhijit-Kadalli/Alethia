name: darwin

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

concurrency:
  group: darwin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift build & test (macOS 14)
    runs-on: macos-14
    timeout-minutes: 45
    env:
      ALETHIA_CRISPER_URL: http://127.0.0.1:8765
      ALETHIA_CRISPER_STUB: "1"
      ALETHIA_CRISPER_ALLOW_STUB: "1"
      ALETHIA_ECAPA_MODEL: ${{ github.workspace }}/Models/ggml-speaker-ecapa-tdnn.bin
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          uname -a
          python3 --version

      - name: Cache CrisperWhisper sidecar venv
        uses: actions/cache@v4
        with:
          path: Tools/crisperwhisper_sidecar/.venv
          key: crisper-stub-venv-${{ runner.os }}-${{ hashFiles('Tools/crisperwhisper_sidecar/requirements-stub.txt', 'Scripts/setup-crisperwhisper.sh') }}

      - name: Setup CrisperWhisper sidecar (stub-capable)
        run: |
          ALETHIA_CRISPER_STUB=1 ./Scripts/setup-crisperwhisper.sh
          ALETHIA_CRISPER_STUB=1 nohup ./Scripts/start-crisper-sidecar.sh > /tmp/crisper-sidecar.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8765/health; then
              echo
              exit 0
            fi
            sleep 0.5
          done
          echo "Sidecar failed to start:" >&2
          cat /tmp/crisper-sidecar.log >&2
          exit 1

      - name: Resolve + build tests
        run: swift build --build-tests

      - name: Run Swift tests
        run: swift test --parallel --enable-code-coverage

      - name: Smoke ASR via CrisperWhisper sidecar (fixture)
        run: |
          set -euo pipefail
          WAV="Fixtures/speech_short.wav"
          test -f "$WAV"
          curl -sf http://127.0.0.1:8765/health | tee /tmp/alethia_asr_health.json
          curl -sf -X POST "http://127.0.0.1:8765/transcribe?mode=intended" \
            -F "audio=@${WAV};type=audio/wav" | tee /tmp/alethia_asr_smoke.json
          grep -q '"text"' /tmp/alethia_asr_smoke.json
