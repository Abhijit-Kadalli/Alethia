name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed tag to publish (defaults to the selected ref)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build and publish DMG
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [[ -z "$tag" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "A v-prefixed release tag is required (for example, v0.1.0)." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Verify tag matches app version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Apps/Alethia/Resources/Info.plist)"
          if [[ "$RELEASE_TAG" != "v$app_version" ]]; then
            echo "Tag $RELEASE_TAG does not match app version $app_version." >&2
            exit 1
          fi

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          uname -a

      - name: Cache standalone Python download
        uses: actions/cache@v4
        with:
          path: .build/downloads
          key: sidecar-python-${{ runner.os }}-arm64-v1

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: sidecar-pip-${{ runner.os }}-arm64-${{ hashFiles('Tools/crisperwhisper_sidecar/requirements.txt', 'Scripts/build-sidecar-runtime.sh') }}

      - name: Build DMG
        env:
          ALETHIA_BUILD_ARCH: arm64
          ALETHIA_BUNDLE_SIDECAR: "1"
        run: ./Scripts/package-dmg.sh release

      - name: Verify microphone entitlement in DMG
        shell: bash
        run: |
          set -euo pipefail
          mount="$(hdiutil attach -readonly -nobrowse -noverify release/*.dmg | awk '/\/Volumes\// {sub(/^.*\/Volumes\//,"/Volumes/"); print; exit}')"
          trap 'hdiutil detach "$mount"' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount/Alethia.app"
          codesign -d --entitlements :- "$mount/Alethia.app" 2>/dev/null \
            | tee /tmp/alethia-entitlements.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' \
            /tmp/alethia-entitlements.plist | grep -qx true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alethia-${{ steps.release.outputs.tag }}-dmg
          path: |
            release/*.dmg
            release/*.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/*.dmg \
            release/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Alethia ${RELEASE_TAG#v}"
