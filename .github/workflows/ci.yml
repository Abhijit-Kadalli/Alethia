name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Core / Text / Knowledge / Audio (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev > /dev/null
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  macos:
    name: App build, tests, size budget (macOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/arm64-apple-macosx
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve
        run: swift package resolve

      - name: Build (debug)
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

      - name: Package app and enforce 10 MiB budget
        env:
          ALETHIA_BUILD_ARCH: arm64
        run: ./Scripts/package-app.sh .build/package

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Alethia.app-${{ github.sha }}
          path: .build/package/Alethia.app
          if-no-files-found: error
